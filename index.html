<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>説明会・イベントのご予約</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --ink:#1b2340; --sub:#4a5470; --line:#e3e8f2;
  --blue:#1677c4; --blue-soft:#e3f3fc; --pink:#d42f6a; --pink-ink:#b0254f; --pink-soft:#fde6ee;
  --mint-soft:#dff6ef; --yellow:#ffe066; --yellow-soft:#fff6d1; --card:#ffffff; --on-accent:#ffffff;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141a2e; --ink:#eef2fb; --sub:#b4bdd4; --line:#2c3552;
    --blue:#5fb2ef; --blue-soft:#1c2c47; --pink:#e04d83; --pink-ink:#ff9cbf; --pink-soft:#3a1f2d;
    --mint-soft:#1a3330; --yellow:#c9a92a; --yellow-soft:#2f2a17; --card:#1b2238; --on-accent:#ffffff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141a2e; --ink:#eef2fb; --sub:#b4bdd4; --line:#2c3552;
  --blue:#5fb2ef; --blue-soft:#1c2c47; --pink:#e04d83; --pink-ink:#ff9cbf; --pink-soft:#3a1f2d;
  --mint-soft:#1a3330; --yellow:#c9a92a; --yellow-soft:#2f2a17; --card:#1b2238; --on-accent:#ffffff;
  color-scheme: dark;
}
html{scroll-padding-top: env(safe-area-inset-top, 0px)}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif;
  line-height:1.6; overflow-x:hidden;
}
.blob{position:fixed; border-radius:50%; z-index:0; pointer-events:none}
.b1{width:320px;height:320px;background:var(--blue-soft);top:-130px;right:-120px}
.b2{width:180px;height:180px;background:var(--mint-soft);bottom:-60px;left:-70px}
.b3{width:120px;height:120px;background:var(--pink-soft);top:38%;left:-70px}
main{position:relative; z-index:1; max-width:460px; margin:0 auto; padding:40px 22px 48px}
.round{font-family:'M PLUS Rounded 1c','Noto Sans JP',sans-serif}
.who{display:inline-block; background:var(--blue); color:var(--on-accent); font-weight:800; font-size:14px; padding:5px 14px; border-radius:999px}
h1{margin:16px 0 6px; font-size:32px; line-height:1.3; font-weight:800}
h1 .mark{background:linear-gradient(transparent 62%, var(--yellow) 62%)}
.lead{margin:0; color:var(--sub); font-size:15px}
.schedule{margin:20px 0 28px; display:grid; gap:8px}
.schedule div{display:flex; gap:10px; align-items:baseline; background:var(--card); border:2px solid var(--line); border-radius:14px; padding:10px 14px}
.schedule b{font-size:16px}
.schedule span{font-size:13px; color:var(--sub)}
.step{margin:0 0 6px; display:flex; align-items:center; gap:8px; font-weight:800; font-size:16px}
.num{width:28px; height:28px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-size:15px; color:var(--on-accent)}
.num.p{background:var(--pink)} .num.b{background:var(--blue)}
.tag{font-size:12px; font-weight:700; padding:2px 8px; border-radius:6px}
.tag.must{background:var(--pink); color:var(--on-accent)}
.tag.opt{background:var(--blue-soft); color:var(--blue)}
a.primary{
  display:flex; align-items:center; justify-content:center; gap:10px;
  min-height:68px; padding:14px 20px; border-radius:18px;
  background:var(--pink); color:var(--on-accent); text-decoration:none;
  font-weight:800; font-size:21px; box-shadow:0 4px 0 var(--pink-ink);
}
a.primary:hover{filter:brightness(1.05)}
a.primary:active{transform:translateY(2px); box-shadow:0 2px 0 var(--pink-ink)}
.note{margin:8px 2px 0; font-size:13px; color:var(--pink-ink); font-weight:700}
.gap{height:30px}
a.secondary{
  display:flex; align-items:center; justify-content:center; gap:8px;
  min-height:54px; padding:12px 18px; border-radius:16px;
  background:var(--card); color:var(--blue); border:2px solid var(--blue); text-decoration:none;
  font-weight:700; font-size:17px;
}
a.secondary:hover{background:var(--blue-soft)}
.small{margin:8px 2px 0; font-size:13px; color:var(--sub)}
.more{margin-top:34px; padding-top:18px; border-top:2px dashed var(--line)}
.more p{margin:0 0 10px; font-size:14px; font-weight:700; color:var(--sub)}
.links{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.links a{display:flex; align-items:center; justify-content:center; gap:6px; min-height:46px; border-radius:12px; background:var(--yellow-soft); color:var(--ink); text-decoration:none; font-weight:700; font-size:15px}
.links a:hover{filter:brightness(0.97)}
footer{margin-top:28px; font-size:12px; color:var(--sub); text-align:center}
a:focus-visible{outline:3px solid var(--blue); outline-offset:3px}
@media (prefers-reduced-motion: reduce){ a.primary:active{transform:none} }
</style>
</head>
<body>
<div class="blob b1" aria-hidden="true"></div>
<div class="blob b2" aria-hidden="true"></div>
<div class="blob b3" aria-hidden="true"></div>
<main>
  <span class="who round">大学3年生向け・学部不問</span>
  <h1 class="round">説明会・イベントの<br><span class="mark">参加申込</span></h1>
  <p class="lead">オンライン・参加無料</p>

  <div class="schedule">
    <div><b class="round">11/4〜11/27</b><span>オンライン説明会（平日 全23回・各90分）</span></div>
    <div><b class="round">12/8(火) 14:00〜</b><span>就活支援イベント × IT商社の会社説明会</span></div>
  </div>

  <p class="step round"><span class="num p">1</span>まずは参加の予約<span class="tag must">必須</span></p>
  <a class="primary round" href="https://startia-group.snar.jp/jobboard/apply.aspx" target="_blank" rel="noopener">マイページから予約する</a>
  <p class="note">一次選考（適性検査）パスは、このボタンからの予約のみ対象です</p>

  <div class="gap"></div>

  <p class="step round"><span class="num b">2</span>お時間がある方はこちらも<span class="tag opt">任意・1分</span></p>
  <a class="secondary" href="https://docs.google.com/forms/d/e/1FAIpQLSeWG6apwWrIcUEHSegFPpa4i7FXevms_CbZ3YAR5kmuPE9TEA/viewform" target="_blank" rel="noopener">事前アンケートに答える</a>
  <p class="small">答えなくても参加できます。いただいた声は今後のイベントづくりに活かします。</p>

  <footer>運営：来春入社予定の内定者</footer>
</main>
</body>
</html>
